name: Build BiliPink APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # 换成ubuntu22.04，原生自带libncurses5，不用额外添加源
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 【修复swap，改用dd，兼容所有github runner】
      - name: Add swap memory
        run: |
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # 下载bdl二进制
      - name: Download bdl-android-arm64 binary
        run: |
          mkdir -p assets
          curl -L --connect-timeout 60 "https://github.com/Yuelioi/bdl/releases/download/v0.8.4/bdl-android-arm64" -o assets/bdl-android-aarch64
          chmod +x assets/bdl-android-aarch64
          ls -lh assets

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # Ubuntu22原生自带ncurses5，依赖简化，不用加jammy源
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev automake autopoint gettext cmake
          sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          sudo update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac

      - name: Install python packages
        run: |
          python -m pip install --upgrade pip setuptools
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Build APK
        run: |
          buildozer -v android release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-AutoBuild
          path: bin/*.apk
