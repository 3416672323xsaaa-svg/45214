name: Build BiliPink APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 下载bdl二进制（月离镜像，稳定）
      - name: Download bdl binary
        run: |
          mkdir -p assets
          wget https://apps.yuelili.com/software/bdl/download/bdl-android-arm64 -O assets/bdl-android-aarch64
          chmod +x assets/bdl-android-aarch64
          ls -lh assets

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 重点：ubuntu官方源自带openjdk17，**不再用失效的openjdk-r PPA**
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev automake autopoint gettext
          # 绑定java版本
          sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          sudo update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac

      - name: Install python packages
        run: |
          python -m pip install --upgrade pip setuptools
          pip install buildozer==1.6.0 cython==0.29.37

      - name: Build APK
        run: |
          buildozer android clean
          buildozer -v android release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-AutoBuild
          path: bin/*.apk
