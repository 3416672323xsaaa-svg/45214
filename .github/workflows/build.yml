name: Build BiliPink APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 下载bdl安卓arm64二进制（镜像站，不会404）
      - name: Fetch bdl binary
        run: |
          mkdir -p assets
          wget https://apps.yuelili.com/software/bdl/download/bdl-android-arm64 -O assets/bdl-android-aarch64
          chmod +x assets/bdl-android-aarch64
          ls -lh assets

      # 社区buildozer action（Github上大量Kivy项目在用）
      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          buildozer-command: buildozer android release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-Auto
          path: bin/*.apk
