name: Build BiliPink APK


on:
  push:
    branches:
      - main

  workflow_dispatch:



jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


      - name: Checkout source
        uses: actions/checkout@v4



      # 下载bdl
      - name: Download bdl binary
        run: |
          mkdir -p assets

          curl -L \
          --connect-timeout 60 \
          "https://github.com/Yuelioi/bdl/releases/download/v0.8.4/bdl-android-arm64" \
          -o assets/bdl-android-aarch64

          chmod +x assets/bdl-android-aarch64

          ls -lh assets



      # Python
      - name: Setup Python 3.9
        uses: actions/setup-python@v5

        with:
          python-version: "3.9"



      # Java17 + 依赖
      - name: Install dependencies
        run: |

          sudo apt update


          sudo apt install -y \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libffi-dev \
          libssl-dev \
          automake \
          cmake



          java -version



      # 清除GitHub默认NDK污染
      - name: Clear Android NDK env
        run: |

          echo "ANDROID_NDK=" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=" >> $GITHUB_ENV



      # Buildozer
      - name: Install build tools
        run: |

          python -m pip install --upgrade pip setuptools


          pip install \
          buildozer==1.5.0 \
          cython==0.29.36



      # 编译
      - name: Build APK
        run: |

          buildozer -v android debug



      # 上传
      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: BiliPink-debug-apk

          path: bin/*.apk
