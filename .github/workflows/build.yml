name: Build BiliPink APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 下载BDL安卓arm64二进制，打包进APK
      - name: Download bdl-android-arm64 binary
        run: |
          mkdir -p assets
          curl -L --connect-timeout 60 "https://github.com/Yuelioi/bdl/releases/download/v0.8.4/bdl-android-arm64" -o assets/bdl-android-aarch64
          chmod +x assets/bdl-android-aarch64
          ls -lh assets

      # 【关键】用Python 3.9，p4a兼容性最好
      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev automake autopoint gettext
          sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          sudo update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac

      # 【关键】buildozer固定1.5.0，公认最稳定版本
      - name: Install python packages
        run: |
          python -m pip install --upgrade pip setuptools
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Build APK
        run: |
          buildozer -v android release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-AutoBuild
          path: bin/*.apk
