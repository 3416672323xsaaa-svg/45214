name: Build BiliPink Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"


      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libssl-dev \
            libffi-dev

          python -m pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install cython==0.29.36


      - name: Prepare bdl binary
        run: |
          mkdir -p assets

          wget \
          https://github.com/Yuelioi/bdl/releases/latest/download/bdl-android-aarch64 \
          -O assets/bdl-android-aarch64

          chmod 755 assets/bdl-android-aarch64

          ls -lh assets/


      - name: Build APK
        run: |
          buildozer android clean
          buildozer -v android release


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-release
          path: bin/*.apk
